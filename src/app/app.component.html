<div class="app-container">
  <app-navbar
    [currentView]="currentView"
    (navigate)="setView($event)">
  </app-navbar>

  <div
    class="page-wrapper"
    [class.home]="currentView !== 'about' && currentView !== 'access' && currentView !== 'privacy' && currentView !== 'media'"
    [class.standard]="currentView === 'about' || currentView === 'access' || currentView === 'privacy' || currentView === 'media'">

    <div
      class="content"
      [class.fade]="animationState === 'active'">

      <div class="content-inner">

        <app-home
          *ngIf="currentView !== 'about' && currentView !== 'access' && currentView !== 'privacy' && currentView !== 'media'"
          (navigate)="setView($event)"
          (activeSectionChange)="setActiveView($event)">
        </app-home>

        <app-about
          *ngIf="currentView === 'about'">
        </app-about>

        <app-access
          *ngIf="currentView === 'access'" (navigate)="setView($event)">
        </app-access>

        <app-privacy
          *ngIf="currentView === 'privacy'">
        </app-privacy>

        <app-media
          *ngIf="currentView === 'media'">
        </app-media>

      </div>
    </div>
  </div>

  <footer
    class="site-footer"
    [class.home-footer]="currentView !== 'about' && currentView !== 'access' && currentView !== 'privacy' && currentView !== 'media'">

    <div class="footer-inner">
      <div class="footer-left">
        © 2026 Danilo Mandić | Meleese Bremer | Refugee Discourse Database | All rights reserved
      </div>

      <div class="footer-meta">
        <a
          href="https://github.com/meleese/rdd-site"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub repository">
          <i class="fa-brands fa-github"></i>
        </a>

        <a
          href="mailto:inquiries@refugeediscoursedatabase.org?subject=Refugee%20Discourse%20Database%20Inquiry">
          <i class="fa-solid fa-envelope"></i>
          Contact Us |
        </a>
      <button
        type="button"
        class="footer-privacy-link"
        (click)="setView('privacy')"
      >
        Privacy Policy
      </button>
      </div>
    </div>
  </footer>
</div>
